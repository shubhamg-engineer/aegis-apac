services:
  - type: web
    name: aegis-apac
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
